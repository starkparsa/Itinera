# For sharing with friends -- pulls the pre-built images CI already
# publishes to GHCR on every merge to main (see .github/workflows/ci.yml's
# build-and-push job) instead of building from source like the main
# docker-compose.yml does. This is what makes "just run it" possible with
# nothing but Docker installed: no Node/Python, no dependency versions to
# match, no platform-specific build quirks (see progress.md's entries on
# exactly those problems when a friend tried the from-source path).
#
# Usage: copy .env.share.example to .env, fill in your own values (a free
# GEMINI_API_KEY at minimum), then:
#   docker compose -f docker-compose.share.yml up
#
# Images are tagged :latest and re-pulled fresh each `up --pull always`
# run -- add that flag to always get whatever's currently on `main`.
services:
  backend:
    image: ghcr.io/starkparsa/itinera-backend:latest
    restart: unless-stopped
    environment:
      # SQLite by default -- zero setup, no account needed anywhere, but
      # ephemeral: data is lost when the container is removed (not just
      # stopped/restarted) unless the volume below is kept. Point this at
      # a real Postgres URL (e.g. a free Neon project) instead for data
      # that survives `docker compose down -v` / sharing across restarts
      # on a fresh machine.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/dev.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DAILY_TRIP_GENERATION_LIMIT: ${DAILY_TRIP_GENERATION_LIMIT:-20}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # All three optional -- Google Places (richer place details/nearby
      # recommendations), Pexels (trip cover photos), and Ticketmaster
      # (event discovery). Leave unset for Wikipedia-only place context,
      # no photos, and no event discovery respectively -- the app runs
      # fine without any of them.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY}
      # Only needed for real Google sign-in / Calendar push -- see
      # .env.share.example. Without these the app still runs; every
      # sign-in attempt just fails at Google's own consent screen.
      AUTH_BACKEND_SECRET: ${AUTH_BACKEND_SECRET:-share-me-a-real-secret}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    ports:
      - "8000:8000"
    volumes:
      # Only actually persists anything when DATABASE_URL above is left at
      # its sqlite default -- harmless (and unused) otherwise.
      - itinera_share_data:/data

  frontend:
    image: ghcr.io/starkparsa/itinera-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_BACKEND_SECRET: ${AUTH_BACKEND_SECRET:-share-me-a-real-secret}
    ports:
      - "3000:3000"

volumes:
  itinera_share_data:
