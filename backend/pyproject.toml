[tool.pytest.ini_options]
# CI runs `pytest -v` directly (not `python -m pytest`), which -- unlike
# `-m` -- does NOT add the current directory to sys.path, so
# tests/conftest.py's `from app import models` fails with
# ModuleNotFoundError there even though it works locally (every local run
# in this project's history used `python -m pytest`, which masked this).
# `pythonpath` is pytest's own built-in ini option (7.0+) for exactly this
# -- explicit and invocation-independent, rather than relying on how
# pytest happens to be invoked.
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Alembic's own script template + every autogenerated revision file --
# machine-generated, re-run through --autogenerate regularly, not worth
# hand-fixing to this project's lint rules each time.
exclude = ["alembic/versions", "alembic/script.py.mako"]

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the standard, intended pattern
    "BLE001", # broad except at the API boundary is intentional here, converted to HTTP 502
    "DTZ",    # naive UTC datetimes are the deliberate convention throughout this app
              # (Trip.created_at etc. are plain DateTime columns, no tz) -- flagging
              # every datetime.utcnow()/date.today() call for this would mean either
              # a project-wide switch to tz-aware columns or a noqa on every call site
]
