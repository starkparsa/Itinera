services:
  # Local MySQL -- kept for reference/rollback only. Local dev and prod both
  # point at Neon Postgres by default now (see CLAUDE.md's "Database: MySQL
  # -> Postgres on Neon" decision row, completed 2026-08-29); `backend`
  # below no longer depends on or reads from this service. Run
  # `docker compose --profile legacy-mysql up mysql` if you specifically
  # need it back for something.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    profiles: ["legacy-mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: travel_planner
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Neon Postgres connection string, from the root .env -- same var
      # every other part of the app reads (database.py, alembic/env.py).
      # No longer a hardcoded local `mysql` container reference.
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Was never forwarded here (pre-existing gap, found by the
      # 2026-08-30 code review) -- .env's own GROQ_API_KEY only fuels this
      # file's ${VAR} interpolation, it doesn't auto-populate the
      # container's environment, so the documented Gemini->Groq fallback
      # (see CLAUDE.md's Reliability decision row) was silently a no-op
      # under `docker compose up` even when a user set the key.
      GROQ_API_KEY: ${GROQ_API_KEY}
      AUTH_BACKEND_SECRET: ${AUTH_BACKEND_SECRET}
      # Needed to refresh a user's Calendar access token (Phase D) --
      # google_calendar.py builds a real google-auth Credentials object
      # with these, same OAuth client as the frontend's login flow.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Same value as the backend's AUTH_BACKEND_SECRET above -- one shared
      # secret, one env var name, read from the same root .env by both
      # services (see CLAUDE.md decision log, "Auth" row).
      AUTH_BACKEND_SECRET: ${AUTH_BACKEND_SECRET}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
